name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a Maple problem.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Provide the release version or commit SHA you tested.
    validations:
      required: true
  - type: dropdown
    id: launch-mode
    attributes:
      label: Launch mode
      options:
        - python -m maple
        - python main.py
        - Packaged executable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python, Pygame, NumPy, and display setup.
      placeholder: Windows 11, Python 3.12, Pygame 2.6, NumPy 2.0, 1920x1080 display
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant terminal output, traceback, screenshot, or recording.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
