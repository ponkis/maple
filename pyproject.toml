[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-wallpaper"
dynamic = ["version"]
description = "Interactive recreation of the Android 4.0 Autumn live wallpaper"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "ponkis" }]
keywords = ["pygame", "wallpaper", "simulation", "ripples", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.20.0",
    "pygame>=2.0.0",
]

[project.urls]
Homepage = "https://ponkis.xyz"
Repository = "https://github.com/ponkis/maple"
Issues = "https://github.com/ponkis/maple/issues"

[project.scripts]
maple = "maple.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "maple.__version__" }

[tool.setuptools.package-data]
maple = ["assets/*.ico", "assets/*.jpg", "assets/*.mp3", "assets/*.png"]
